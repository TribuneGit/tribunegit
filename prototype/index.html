<section class="hero"><div class="wrap" style="max-width:480px">
  <div class="eyebrow">Early access</div>
  <h1 style="max-width:16ch">Prototype</h1>
  <p class="lead" style="margin-top:18px">This is a restricted preview build. Enter the access
  password to continue.</p>

  <form id="proto-form" style="margin-top:28px;display:flex;flex-direction:column;gap:14px" autocomplete="off">
    <input type="password" id="proto-pass" name="password" placeholder="Access password" required
      style="padding:14px 16px;border-radius:8px;border:1px solid rgba(10,11,18,0.2);font-size:16px;font-family:inherit;width:100%">
    <button type="submit" class="btn btn-primary" style="width:100%">Continue &rarr;</button>
  </form>
  <p id="proto-msg" class="small muted" style="margin-top:14px;min-height:20px"></p>

<script>
(function () {
  var PASSWORD = "Tribune2000!EarlyAccess#";
  var DEST = "https://denialengine.netlify.app";
  var form = document.getElementById("proto-form");
  var input = document.getElementById("proto-pass");
  var msg = document.getElementById("proto-msg");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (input.value === PASSWORD) {
      msg.textContent = "Access granted. Redirecting\u2026";
      window.location.href = DEST;
    } else {
      msg.textContent = "Incorrect password. Returning to Tribune Inc.\u2026";
      setTimeout(function () {
        window.location.href = "/";
      }, 1200);
    }
  });
})();
</script>
