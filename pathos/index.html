<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Red Thread — Tribune × Pathos</title>
<meta name="description" content="An operating book for Pathos. A future with AI that keeps the human touch points, prepared by Tribune." />
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://tribuneinc.com/pathos/">
<link rel="alternate" type="text/markdown" href="https://tribuneinc.com/pathos.md" title="The Red Thread — Markdown">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   THE RED THREAD  ·  an operating book for Pathos  ·  Tribune
   White paper, black ink, one crimson thread. Single theme by design.
   HAL: logo assets are marked with "HAL:" comments below.
   ============================================================ */
:root{
  --desk:#141416;
  --paper:#FFFFFF;
  --paper-2:#F6F5F3;
  --ink:#111111;
  --ink-2:#3A3A3A;
  --mute:#7A7A7A;
  --line:rgba(17,17,17,0.10);
  --line-2:rgba(17,17,17,0.18);
  --crimson:#9E1B32;
  --crimson-2:#B5203A;
  --crimson-soft:rgba(158,27,50,0.07);
  --serif:"Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --bw:min(1180px, 96vw);
  --bh:min(740px, calc(100vh - 150px));
  --pad:clamp(28px, 3.6vw, 52px);
  --flip:1700ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1300px 800px at 50% 40%, #232326 0%, var(--desk) 62%), var(--desk);overflow-x:hidden}
::selection{background:rgba(158,27,50,.2)}
a{color:inherit}

/* ---------- top bar ---------- */
/* ---------- Tribune × Pathos header (white, matches tribuneinc.com m-header) ---------- */
.pathos-header{position:fixed;top:0;left:0;right:0;z-index:50;pointer-events:auto;
  background:#FFFFFF;border-bottom:1px solid rgba(10,11,18,.12);height:80px}
.pathos-header .wrap{max-width:1140px;margin:0 auto;padding:0 24px;height:100%;
  display:flex;align-items:center;gap:18px}
.pathos-header .lockup{display:flex;align-items:center;gap:14px;text-decoration:none}
.pathos-header .lockup:hover{text-decoration:none}
.pathos-header .lockup svg{height:34px;width:auto}
.pathos-header .wordmark{font-family:'Archivo',var(--sans);font-weight:700;letter-spacing:.2em;font-size:17px;color:#0A0B12}
.pathos-header .pathos-lockup img{height:19px;width:auto;display:block}
.pathos-header .pathos-x{font-family:'Archivo',var(--sans);font-size:17px;color:#8C8896;font-weight:500}
.pathos-header .m-nav{display:flex;align-items:center;gap:22px;margin-left:auto}
.pathos-header .pathos-doctitle{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8C8896;white-space:nowrap}
.pathos-header .pathos-dot{color:#7A1A5C}
.pathos-header .fsbtn{color:#16141F;border-color:rgba(10,11,18,.24)}
.pathos-header .fsbtn:hover{color:#7A1A5C;border-color:#7A1A5C;background:rgba(122,26,92,.08)}
.pathos-header .progress{display:none;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8C8896;white-space:nowrap;align-items:center;gap:8px}
.pathos-header .progress-track{display:inline-block;width:64px;height:3px;border-radius:2px;background:rgba(10,11,18,.12);overflow:hidden;vertical-align:middle}
.pathos-header .progress-fill{display:block;height:100%;width:0;background:var(--crimson,#9E1B32);transition:width .3s ease}
@media(max-width:760px){
  .pathos-header{height:auto}
  .pathos-header .wrap{flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
  .pathos-header .pathos-doctitle{display:none}
  .pathos-header .m-nav{margin-left:0}
  .pathos-header .progress{display:flex;order:3;width:100%;margin-top:6px}
}
body.fs .pathos-header{display:none}
/* ---------- Kindle-style mobile chrome toggle + swipe hint ---------- */
@media (max-width:860px){
  body.chrome-hidden .pathos-header,
  body.chrome-hidden .ctl{transform:translateY(-140%);opacity:0;pointer-events:none}
  body.chrome-hidden .ctl{transform:translateY(140%)}
  .pathos-header,.ctl{transition:transform .28s ease,opacity .28s ease}
  .swipehint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:55;background:rgba(20,20,22,.92);color:#e8e8ec;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border-radius:999px;
    display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .4s}
  .swipehint.show{opacity:1}
}
@media (min-width:861px){ .swipehint{display:none} }

/* ---------- stage ---------- */
.stage{min-height:100vh;display:grid;place-items:center;padding:104px 12px 96px}
.book-wrap{width:var(--bw);height:var(--bh);perspective:2800px;position:relative}
.book{position:absolute;inset:0;perspective:2600px;transition:transform 1100ms cubic-bezier(.65,.05,.25,1)}
.book.closed{transform:translateX(-25%)}

.page{position:absolute;top:0;bottom:0;width:50%;background:var(--paper);color:var(--ink);overflow:hidden}
.page.left{left:0;border-radius:4px 0 0 4px;box-shadow:inset -26px 0 34px -30px rgba(0,0,0,.35)}
.page.right{right:0;border-radius:0 4px 4px 0;box-shadow:inset 26px 0 34px -30px rgba(0,0,0,.35)}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85 0 0 0 0 0.85 0 0 0 0 0.85 0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.book .edges{position:absolute;top:5px;bottom:5px;width:50%;pointer-events:none;z-index:-1;transition:opacity 600ms}
.book .edges.r{right:-1px;border-radius:0 4px 4px 0;
  box-shadow: 3px 0 0 #ecebe8, 6px 0 0 #dcdad6, 9px 0 0 #eeede9, 12px 0 0 #d8d6d1, 15px 0 0 #e9e8e4, 0 34px 80px rgba(0,0,0,.7)}
.book .edges.l{left:-1px;border-radius:4px 0 0 4px;
  box-shadow: -3px 0 0 #ecebe8, -6px 0 0 #dcdad6, -9px 0 0 #eeede9, -12px 0 0 #d8d6d1, -15px 0 0 #e9e8e4, 0 34px 80px rgba(0,0,0,.7)}
.book.closed .edges.l{opacity:0}
.book.at-end .edges.r{opacity:0}

/* the turning leaf */
.leaf{position:absolute;top:0;bottom:0;width:50%;z-index:20;will-change:transform}
.leaf.fwd{right:0;transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.leaf .face{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
.leaf .face::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85 0 0 0 0 0.85 0 0 0 0 0.85 0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.leaf.fwd .face{border-radius:0 4px 4px 0}
.leaf.bwd .face{border-radius:4px 0 0 4px}
.leaf .shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
.leaf .gilt{filter:none}
.leaf .page::before,.leaf .face::before{will-change:opacity}
.leaf.fwd .shade{background:linear-gradient(90deg, rgba(0,0,0,.28), transparent 60%)}
.leaf.bwd .shade{background:linear-gradient(-90deg, rgba(0,0,0,.28), transparent 60%)}
.leaf.turning .shade{opacity:1}
.book .cast{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;opacity:0;transition:opacity 700ms ease-in-out;z-index:15}
.book .cast.l{left:0;background:linear-gradient(90deg, transparent 45%, rgba(0,0,0,.22))}
.book .cast.r{right:0;background:linear-gradient(-90deg, transparent 45%, rgba(0,0,0,.22))}
.book .cast.on{opacity:1}
.gutter{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);
  background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.14) 50%, rgba(0,0,0,.28));z-index:12;pointer-events:none}
.book.closed .gutter{opacity:0}

/* ---------- page content ---------- */
.inner{position:relative;z-index:2;height:100%;padding:var(--pad);padding-top:calc(var(--pad) + 14px);padding-bottom:calc(var(--pad) + 14px);
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent;display:flex;flex-direction:column}
.inner::-webkit-scrollbar{width:6px}.inner::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
.page.left .inner{padding-right:calc(var(--pad) + 8px)}
.page.right .inner{padding-left:calc(var(--pad) + 8px)}

.folio{position:absolute;bottom:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--mute);z-index:3;text-transform:uppercase;display:flex;gap:14px;align-items:center}
.page.left .folio,.leaf.bwd .face.front .folio,.leaf.fwd .face.back .folio{left:var(--pad)}
.page.right .folio,.leaf.fwd .face.front .folio,.leaf.bwd .face.back .folio{right:var(--pad);flex-direction:row-reverse}
.folio .n{color:var(--ink)}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--crimson);margin:0 0 16px}
.eyebrow.g{color:var(--mute)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,4.6vw,64px);line-height:1.02}
h2{font-size:clamp(36px,3.8vw,52px);line-height:1.04;margin-bottom:18px}
h2.s{font-size:clamp(30px,3vw,40px)}
h2 em,h1 em{font-style:italic;color:var(--crimson)}
h3{font-size:24px;line-height:1.15;margin-bottom:8px}
p{margin:0 0 16px;color:var(--ink-2);max-width:54ch}
p.lead{font-size:22px;color:var(--ink);line-height:1.4;font-family:var(--serif);margin-bottom:18px}
p strong{color:var(--ink);font-weight:500}
.small{font-size:13px;color:var(--mute)}
.mute{color:var(--mute)}
.grow{flex:1}

/* short lists with a crimson knot */
.heard{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.heard > div{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start}
.heard .k{width:9px;height:9px;border-radius:50%;background:var(--crimson);margin-top:9px;box-shadow:0 0 0 3px var(--crimson-soft)}
.heard b{display:block;font-family:var(--serif);font-size:21px;font-weight:400;color:var(--ink);line-height:1.15;margin-bottom:1px}
.heard span{color:var(--ink-2);font-size:14.5px;line-height:1.45;display:block}

/* margin note, addressed to Shane / Alex */
.margin{margin-top:auto;border-left:2px solid var(--crimson);padding:4px 0 4px 16px;position:relative}
.margin .who{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson);margin-bottom:4px}
.margin p{margin:0;color:var(--ink);font-family:var(--serif);font-size:20px;line-height:1.3}

/* ---------- NOTES: the red pins that open detail ---------- */
.pin{all:unset;cursor:pointer;display:inline-grid;place-items:center;vertical-align:super;
  width:16px;height:16px;border-radius:50%;background:var(--crimson);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:500;line-height:1;margin:0 2px 0 5px;
  transition:transform .15s, background .15s;position:relative;top:-2px}
.pin:hover{transform:scale(1.15);background:var(--crimson-2)}
.pin:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
.notes{display:none}
.slip{position:absolute;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:2px solid var(--crimson);
  box-shadow:0 -18px 40px rgba(0,0,0,.18);padding:26px var(--pad) 30px;max-height:88%;overflow-y:auto;
  transform:translateY(102%);transition:transform 520ms cubic-bezier(.3,.8,.3,1)}
.slip.in{transform:translateY(0)}
.slip .hd{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding-right:36px}
.slip .hd .t{font-family:var(--serif);font-size:24px;line-height:1.1}
.slip .hd .no{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson)}
.slip .x{all:unset;cursor:pointer;position:absolute;top:14px;right:16px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:18px;color:var(--mute);transition:all .15s}
.slip .x:hover{background:var(--paper-2);color:var(--ink)}
.slip .x:focus-visible{outline:2px solid var(--crimson)}
.slip p{font-size:14.5px;margin-bottom:10px}
.slip ul{margin:0 0 10px;padding-left:18px;color:var(--ink-2);font-size:14.5px}
.slip li{margin:3px 0}
.slip .row{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.slip .row:first-child{border-top:0}
.slip .row .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.slip .row .v{color:var(--ink)}
.slip .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:3px;border:1px solid var(--crimson);color:var(--crimson)}

/* heatmap (automation map note) */
.heat{display:grid;grid-template-columns:110px repeat(5,1fr);gap:3px;font-size:11.5px;margin:6px 0 10px}
.heat .h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:4px 2px;text-align:center}
.heat .rl{font-size:12px;color:var(--ink-2);padding:6px 4px 0 0;text-align:right}
.heat .c{height:28px;border-radius:2px;background:var(--crimson);opacity:.08}
.heat .c.w{opacity:.28}.heat .c.h2{opacity:.6}.heat .c.h3{opacity:.92}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;background:var(--crimson);vertical-align:middle;margin-right:5px}

/* contents */
.toc{display:flex;flex-direction:column;margin-top:2px}
.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:0 14px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.toc button:hover .t,.toc button:focus-visible .t{color:var(--crimson)}
.toc button:focus-visible{outline:2px solid var(--crimson);outline-offset:4px}
.toc .no{font-family:var(--mono);font-size:11px;color:var(--crimson);letter-spacing:.1em}
.toc .t{font-family:var(--serif);font-size:18px;line-height:1.1;transition:color .2s}
.toc .d{font-size:11px;color:var(--mute);grid-column:2;line-height:1.2}
.toc .pg{font-family:var(--mono);font-size:11px;color:var(--mute)}

/* four layers */
.layers{display:flex;flex-direction:column;margin-top:6px}
.layer{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line-2)}
.layer:last-child{border-bottom:1px solid var(--line-2)}
.layer .no{font-family:var(--mono);font-size:11px;color:var(--crimson);letter-spacing:.1em}
.layer b{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--ink);line-height:1.1}
.layer span{display:block;color:var(--ink-2);font-size:15px;margin-top:3px}

/* split: human / machine */
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px;align-items:start}
.split h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--crimson)}
.split .mac h4{color:var(--mute)}
.split ul{margin:0;padding:0;list-style:none}
.split li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2);line-height:1.35}
.split .hum li{color:var(--ink);font-family:var(--serif);font-size:17.5px;line-height:1.25}

/* loop */
.loop4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.loop4 div{border-top:1px solid var(--line-2);padding-top:10px}
.loop4 b{display:block;font-family:var(--serif);font-size:23px;font-weight:400;line-height:1.1;margin-bottom:3px}
.loop4 span{font-size:13.5px;color:var(--ink-2);display:block;line-height:1.35}

/* value stack (pricing figure) */
.stack{margin-top:14px;display:grid;grid-template-columns:1fr 2fr;gap:14px}
.stack .col{display:flex;flex-direction:column;gap:4px}
.stack .col.new{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:start}
.stack .col.new .cap{grid-column:1/-1}
.stack .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.stack .blk{padding:8px 10px;border-radius:2px;font-size:13px;color:var(--ink);background:var(--crimson-soft);border:1px solid rgba(158,27,50,.25)}
.stack .blk.g{background:#F1F0ED;border-color:var(--line-2);color:var(--ink-2)}
.stack .blk.big{padding:12px 10px;height:100%}
.stack .blk small{display:block;font-size:11px;color:var(--mute);margin-top:2px;line-height:1.3}
.stack .col.old .blk{opacity:.85}
.stack .strike{text-decoration:line-through;color:var(--mute)}

/* steps (Jeff's three) */
.steps{display:flex;flex-direction:column;margin-top:4px}
.step{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.step:last-child{border-bottom:1px solid var(--line-2)}
.step .no{font-family:var(--mono);font-size:11px;color:var(--crimson);letter-spacing:.1em;padding-top:6px}
.step b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.1;margin-bottom:3px}
.step span{display:block;font-size:14px;color:var(--ink-2);line-height:1.45}

/* the pack */
.pack{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:6px;font-size:14px}
.pack div{padding:6px 0;border-top:1px solid var(--line)}
.pack b{font-family:var(--serif);font-size:19px;font-weight:400;color:var(--ink)}
.pack span{display:block;color:var(--mute);font-size:12.5px}
.pack span.sal{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--crimson);margin-top:3px}
.pack-total{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pack-total b{font-family:var(--serif);font-size:19px;font-weight:400;color:var(--ink)}
.pack-total span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.pack-stat{display:flex;gap:28px;flex-wrap:wrap;margin:16px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pack-stat div{display:flex;flex-direction:column}
.pack-stat b{font-family:var(--serif);font-size:32px;font-weight:400;line-height:1.05;color:var(--ink)}
.pack-stat b.c{color:var(--crimson)}
.pack-stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.pill{display:inline-block;align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--mute);margin-bottom:14px}

/* timeline */
.tl{position:relative;margin-top:8px;padding-left:24px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:10px;width:2px;background:var(--crimson)}
.tl .ph{position:relative;padding:0 0 18px}
.tl .ph::before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--crimson)}
.tl .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson);margin-bottom:2px}
.tl b{display:block;font-family:var(--serif);font-size:25px;font-weight:400;line-height:1.1;margin-bottom:3px}
.tl span{font-size:15px;color:var(--ink-2);display:block}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:4px;font-size:15px}
.roles div{padding:9px 0;border-top:1px solid var(--line)}
.roles b{display:block;color:var(--ink);font-weight:500}
.roles span{color:var(--mute);font-size:13.5px}

/* asks (Shane / Alex) */
.ask{list-style:none;padding:0;margin:4px 0 0;counter-reset:q}
.ask li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);line-height:1.45}
.ask li::before{content:counter(q, decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--crimson);padding-top:3px;letter-spacing:.08em}
.ask li b{color:var(--ink);font-weight:500}

/* people */
.person{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:start;margin-bottom:10px}
.person .photo{width:88px;height:88px;border-radius:50%;object-fit:cover;background:#E9E7E2;display:grid;place-items:center;font-family:var(--serif);font-size:30px;color:var(--mute);border:1px solid var(--line-2)}
.person h3{margin:4px 0 2px}
.person .role{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson)}
.links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--crimson);padding-bottom:1px}
.links a:hover{color:var(--crimson)}

/* two documents */
.twodocs{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:stretch;margin-top:6px}
.doc{border:1px solid var(--line-2);border-radius:3px;padding:12px 14px 10px;background:var(--paper);position:relative;box-shadow:3px 3px 0 var(--paper-2), 3px 3px 0 1px var(--line)}
.doc .dh{display:flex;align-items:baseline;gap:8px}
.doc .no{font-family:var(--mono);font-size:10.5px;color:var(--crimson);letter-spacing:.1em}
.doc b{font-family:var(--serif);font-size:20px;font-weight:400;line-height:1.1}
.doc .by{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:4px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc ul{margin:0;padding:0;list-style:none}
.doc li{font-size:13px;color:var(--ink-2);padding:2px 0 2px 12px;line-height:1.4;position:relative}
.doc li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--crimson)}
.twodocs .arrow{display:grid;place-items:center;position:relative}
.twodocs .arrow::before{content:"";position:absolute;left:4px;right:4px;top:50%;height:1px;background:var(--crimson)}
.twodocs .arrow::after{content:"";position:absolute;right:4px;top:50%;width:6px;height:6px;border-top:1px solid var(--crimson);border-right:1px solid var(--crimson);transform:translateY(-50%) rotate(45deg)}
.twodocs .arrow span{position:relative;background:var(--paper);padding:0 3px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--crimson);transform:rotate(-90deg)}

/* ---------- the retro tv ---------- */
.tv{--wood-1:#7a4a24;--wood-2:#5c3318;--wood-3:#93613a;margin-top:4px}
.tv .cab{border-radius:16px;padding:14px;position:relative;
  background:repeating-linear-gradient(93deg, rgba(255,255,255,.045) 0 1px, transparent 1px 4px, rgba(0,0,0,.06) 4px 5px, transparent 5px 11px),
             linear-gradient(160deg, var(--wood-3) 0%, var(--wood-1) 38%, var(--wood-2) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22), inset 0 -3px 8px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.35);
  display:grid;grid-template-columns:1fr 84px;gap:12px}
.tv .scr{background:#0b0b0c;border-radius:16px;padding:10px;box-shadow:inset 0 0 0 2px #000, inset 0 6px 18px rgba(0,0,0,.9);cursor:pointer;position:relative}
.tv .scr:focus-visible{outline:2px solid var(--crimson-2);outline-offset:3px}
.tv .tube{position:relative;aspect-ratio:4/3;overflow:hidden;background:#050505;border-radius:10% / 8%;box-shadow:inset 0 0 42px rgba(0,0,0,.95)}
.tv .lay{position:absolute;inset:0;pointer-events:none}
.tv .card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8% 9%;color:#dfffe9;font-family:var(--mono);
  background:radial-gradient(ellipse at 50% 45%, #1d3b2a 0%, #0a1710 65%, #050505 100%);transition:opacity .25s}
.tv .c-kicker{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;opacity:.65;margin-bottom:8px}
.tv .c-name{font-family:var(--serif);font-size:clamp(22px,2.6vw,34px);line-height:1.05;color:#eafff1;text-shadow:0 0 12px rgba(125,211,160,.8), 1.5px 0 0 rgba(255,60,60,.35), -1.5px 0 0 rgba(60,140,255,.35)}
.tv .c-line{font-size:11.5px;line-height:1.4;margin-top:8px;opacity:.85;max-width:30ch}
.tv .c-url{font-size:10px;letter-spacing:.14em;margin-top:12px;opacity:.6;text-transform:uppercase}
.tv .aperture{background:repeating-linear-gradient(to right, rgba(255,0,0,.05) 0 1px, rgba(0,255,0,.05) 1px 2px, rgba(0,0,255,.05) 2px 3px)}
.tv .scan{background:repeating-linear-gradient(to bottom, transparent 0 1px, rgba(0,0,0,.3) 2px 3px);mix-blend-mode:multiply;opacity:.85}
.tv .vig{background:radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.3) 74%, rgba(0,0,0,.72) 100%)}
.tv .glare{background:linear-gradient(128deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.05) 16%, transparent 38%)}
.tv .roll{position:absolute;left:0;right:0;height:22%;top:-22%;pointer-events:none;background:linear-gradient(to bottom, transparent, rgba(255,255,255,.07) 50%, transparent);animation:tvroll 9s linear infinite}
@keyframes tvroll{to{transform:translateY(560%)}}
.tv .tube.zap .card{opacity:0}
.tv .tube.zap::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(#333 0 25%, #777 0 50%) 0 0/4px 4px;opacity:.7;animation:static .12s steps(2) infinite}
@keyframes static{to{background-position:4px 4px}}
.tv .osd{position:absolute;top:16px;left:18px;font-family:var(--mono);font-weight:700;color:#dfffe9;text-shadow:0 0 10px rgba(125,211,160,.95);font-size:18px;letter-spacing:2px;opacity:0;transition:opacity .25s;pointer-events:none}
.tv .osd .osd-l{display:block;font-size:8px;letter-spacing:3px;opacity:.9}
.tv .osd.show{opacity:1}
.tv .pnl{border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:linear-gradient(160deg, #3a342e 0%, #241f1b 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 6px rgba(0,0,0,.6)}
.tv .knobw{display:flex;flex-direction:column;align-items:center;gap:5px}
.tv .knob{width:48px;height:48px;border-radius:50%;cursor:pointer;position:relative;
  background:radial-gradient(circle at 34% 28%, #6a6259 0%, #3d3833 44%, #1c1917 100%);
  box-shadow:0 0 0 3px #15120f, 0 0 0 5px rgba(190,170,140,.3), inset 0 2px 3px rgba(255,255,255,.22), inset 0 -3px 6px rgba(0,0,0,.7);
  transition:transform 320ms cubic-bezier(.34,1.56,.64,1)}
.tv .knob::after{content:"";position:absolute;top:6px;left:50%;width:4px;height:13px;border-radius:2px;transform:translateX(-50%);background:linear-gradient(#f2e3c8,#b39a72)}
.tv .knob:focus-visible{outline:2px solid var(--crimson-2);outline-offset:3px}
.tv .klbl{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:#b7a68c;text-transform:uppercase}
.tv .led{width:9px;height:9px;border-radius:50%;background:#ff4436;box-shadow:0 0 9px 2px rgba(255,68,54,.85)}
.tv .brandtag{margin-top:auto;font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:#d9c4a4;text-transform:uppercase}
.tv .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tv .chip{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.tv .chip:hover{border-color:var(--crimson);color:var(--crimson)}
.tv .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tv .chip.li i{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:2px;background:#0A66C2;color:#fff;font-style:normal;font-size:9px;font-weight:700;font-family:var(--sans)}
.tv .chip.on.li i{background:#fff;color:#0A66C2}
.tv .chip:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}

/* ============================================================
   HARDCOVER: oxblood boards, gold tooling, gilt page edges
   ============================================================ */
:root{
  --board:#4a0c1a; --board-2:#2e0710; --board-3:#63142a;
  --gold:#d4b163; --gold-2:#f3e2a2; --gold-3:#9d7a2f; --cream:#EADFC6;
  --gilt:linear-gradient(180deg,#f6e7a8 0%,#c9a24a 38%,#f1d77a 55%,#a8822e 100%);
}
.cover .inner{justify-content:space-between}
.cover .mark{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase}
.cover .mark .x{letter-spacing:0}
.cover .mark b{font-weight:500}
.cover .sub{font-family:var(--serif)}
.cover .meta{font-family:var(--mono);text-transform:uppercase}
.cover .open{position:absolute;bottom:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.cover .open::after{content:"";width:34px;height:1px;animation:nudge 1.8s ease-in-out infinite}
.page.cover,.face.cover{
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.10), transparent 55%),
    radial-gradient(90% 80% at 80% 100%, rgba(0,0,0,.45), transparent 60%),
    linear-gradient(160deg, var(--board-3) 0%, var(--board) 45%, var(--board-2) 100%);
  color:var(--cream);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.08), inset 0 -3px 10px rgba(0,0,0,.6);
}
.page.cover::before,.face.cover::before{ /* leather: a lit relief of pebbled grain, with a fine tooth on top */
  opacity:.78;mix-blend-mode:multiply;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.06' numOctaves='5' seed='11' stitchTiles='stitch' result='n'/><feDiffuseLighting in='n' lighting-color='white' surfaceScale='3.2' diffuseConstant='1.1'><feDistantLight azimuth='225' elevation='58'/></feDiffuseLighting></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='t'><feTurbulence type='fractalNoise' baseFrequency='1.6' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .7 0'/></filter><rect width='100%' height='100%' filter='url(%23t)'/></svg>");
  background-size:300px 300px, 120px 120px;
}
.page.cover .inner::before,.face.cover .inner::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.35) 100%), linear-gradient(115deg, rgba(255,255,255,.07) 0%, transparent 30%, transparent 70%, rgba(0,0,0,.12) 100%)}
.page.cover .inner,.face.cover .inner{position:relative}
.page.cover,.face.cover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.10), inset 0 -3px 10px rgba(0,0,0,.65), inset 0 0 90px rgba(0,0,0,.35)}
/* spine: a raised band along the hinge */
.page.cover::after,.face.cover::after{
  background:linear-gradient(90deg, rgba(0,0,0,.55) 0, rgba(0,0,0,.2) 10px, rgba(255,255,255,.06) 14px, transparent 22px);
}
.page.cover.back::after,.face.cover.back::after{
  background:linear-gradient(270deg, rgba(0,0,0,.55) 0, rgba(0,0,0,.2) 10px, rgba(255,255,255,.06) 14px, transparent 22px);
}
/* gold tooling frame */
.cover .frame{position:absolute;inset:18px;pointer-events:none;z-index:1;
  border:1px solid rgba(212,177,99,.55);outline:3px double rgba(212,177,99,.55);outline-offset:4px}
.cover .frame i{position:absolute;width:9px;height:9px;transform:rotate(45deg);background:var(--gilt);opacity:.9}
.cover .frame i:nth-child(1){top:-5px;left:-5px}.cover .frame i:nth-child(2){top:-5px;right:-5px}
.cover .frame i:nth-child(3){bottom:-5px;left:-5px}.cover .frame i:nth-child(4){bottom:-5px;right:-5px}
.cover .inner{padding:clamp(34px,6vh,68px) calc(var(--pad) + 8px) calc(var(--pad) + 4px)}
.gilt{background:var(--gilt);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.55)) drop-shadow(0 -1px 0 rgba(255,255,255,.08))}
.cover .mark{color:var(--gold);justify-content:center;letter-spacing:.4em}
.cover .mark b{color:var(--gold)}
.cover .mark .x{color:var(--gold-3)}
.cover .mark img{filter:none;height:20px;opacity:.95;
  filter:brightness(0) saturate(100%) invert(76%) sepia(34%) saturate(520%) hue-rotate(6deg) brightness(93%)}  /* white SVG toned gold */
.cover .rule{display:flex;align-items:center;gap:12px;color:var(--gold);font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;margin:clamp(4px,1.1vh,10px) 0}
.cover .rule::before,.cover .rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--gold), transparent)}
.cover h1{margin-top:0;text-align:center;font-size:clamp(36px,min(4.9vw,7.6vh),70px);line-height:1;text-transform:uppercase;letter-spacing:.06em;font-style:normal}
.cover h1 em{font-style:italic;text-transform:none;letter-spacing:0;color:inherit;display:block;font-size:.82em}
.cover .panel{margin:clamp(4px,1.1vh,10px) auto 0;padding:clamp(6px,1.3vh,12px) 16px;border:1px solid rgba(212,177,99,.55);max-width:none;width:100%;text-align:center;position:relative}
.cover .panel::before{content:"";position:absolute;inset:3px;border:1px solid rgba(212,177,99,.3)}
.cover .sub{color:var(--cream);font-style:italic;font-size:clamp(13px,min(1.25vw,1.9vh),16.5px);line-height:1.42;margin:0;max-width:none}
.cover .sub em{color:var(--gold-2);font-style:italic}
.cover .meta{color:var(--gold);text-align:center;font-size:9.5px;letter-spacing:.18em;line-height:1.7;padding-bottom:24px;margin-top:clamp(6px,1.4vh,14px)!important}
.cover .meta b{color:var(--cream)}
.cover .open{color:var(--gold);left:0;right:0;justify-content:center}
.cover .open::after{background:var(--gold)}
/* back board */
.cover.back .inner{justify-content:center;align-items:center;text-align:center}
.cover.back .emblem{width:150px;height:150px;border-radius:50%;border:1px solid rgba(212,177,99,.7);outline:3px double rgba(212,177,99,.5);outline-offset:6px;display:grid;place-items:center;margin:0 auto 22px;position:relative}
.cover.back .emblem svg{width:110px;height:110px;overflow:visible}
.cover.back .emblem path{fill:none;stroke:url(#g);stroke-width:2.2;stroke-linecap:round}
.cover.back .sub{max-width:30ch;margin:0 auto}
.cover.back .meta{margin-top:26px}
.cover.back .colophon{margin-top:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-3)}

/* gilt page edges */
.book .edges.r,.book .edges.l,.book .edges.b,.book .edges.f{box-shadow:0 34px 80px rgba(0,0,0,.7)}
.book .edges.r::before,.book .edges.l::before,.book .edges.b::before,.book .edges.f::before{content:"";position:absolute;top:4px;bottom:4px;width:16px;
  background:repeating-linear-gradient(90deg, #a8822e 0 1px, #f1d77a 1px 2px, #c9a24a 2px 3px, #7d5f1e 3px 4px);
  box-shadow:inset 0 0 6px rgba(0,0,0,.35)}
.book .edges.r::before{right:-16px;border-radius:0 3px 3px 0}
.book .edges.l::before{left:-16px;border-radius:3px 0 0 3px}
.book .edges::after{content:"";position:absolute;top:4px;bottom:4px;width:16px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg, transparent 0%, rgba(255,248,220,.95) 50%, transparent 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 -60%}
.book .edges.r::after{right:-16px}.book .edges.l::after{left:-16px}
.book-wrap.reveal .edges::after{animation:sheen 1600ms ease-in-out}
@keyframes sheen{0%{opacity:0;background-position:0 -60%}25%{opacity:.95}75%{opacity:.85;background-position:0 160%}100%{opacity:0;background-position:0 160%}}
.book-wrap.reveal{animation:tilt 1600ms cubic-bezier(.4,0,.2,1)}
@keyframes tilt{0%{transform:rotateY(0) rotateX(0)}35%{transform:rotateY(-10deg) rotateX(3deg)}100%{transform:rotateY(0) rotateX(0)}}

/* ---------- fullscreen reading ---------- */
.fsbtn{all:unset;cursor:pointer;pointer-events:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#d8d8dc;
  padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.fsbtn:hover{color:#fff;border-color:var(--crimson-2);background:rgba(158,27,50,.15)}
.fsbtn:focus-visible{outline:2px solid var(--crimson-2);outline-offset:3px}
.fsbtn svg{width:12px;height:12px}
body.fs .topbar,body.fs .ctl{display:none}
body.fs{--bw:min(96vw, calc((100vh - 36px) * 1.6));--bh:calc(var(--bw) / 1.6)}
body.fs .stage{padding:18px 0}
body:not(.fs) .stage{padding-top:104px}
.fsnav{position:fixed;top:0;bottom:0;width:min(120px,9vw);z-index:45;display:none;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.35);font-size:34px;font-family:var(--serif);transition:color .2s;user-select:none}
/* desk-mode page-turn arrows, sit on the outer edge of each open page (not fullscreen — .fsnav covers that) */
.pgnav{position:absolute;top:0;bottom:0;width:56px;z-index:30;display:none;align-items:center;justify-content:center;cursor:pointer;color:rgba(17,17,17,.2);font-size:26px;font-family:var(--serif);transition:color .15s,background .15s;user-select:none;background:transparent}
.pgnav.l{left:0;border-radius:4px 0 0 4px}
.pgnav.r{right:0;border-radius:0 4px 4px 0}
.pgnav:hover{color:var(--crimson);background:rgba(158,27,50,.05)}
body:not(.fs) .pgnav{display:flex}
body.fs .pgnav{display:none}
.book.closed .pgnav.l,.book.at-end .pgnav.r{opacity:0;pointer-events:none}
.book.turning .pgnav{opacity:0;pointer-events:none}
.book.note-open .pgnav{pointer-events:none}
@media (max-width:860px){ .pgnav{display:none!important} }
.fsnav:hover{color:#fff}
.fsnav.l{left:0}.fsnav.r{right:0}
body.fs .fsnav{display:flex}
.fshint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:46;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);opacity:0;pointer-events:none;transition:opacity .4s}
body.fs .fshint{opacity:1;animation:hintfade 4s forwards}
@keyframes hintfade{0%,70%{opacity:1}100%{opacity:0}}
@media (max-width:860px){ .book-wrap.reveal{animation:none} .fsnav{display:none!important} body.fs .ctl{display:grid} }

/* ledger + facts (chapter six) */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.ledger .col{border-top:2px solid var(--ink);padding-top:8px}
.ledger .col.gain{border-top-color:var(--crimson)}
.ledger .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.ledger .gain .cap{color:var(--crimson)}
.ledger .ln{padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.ledger .ln span{display:block;color:var(--ink)}
.ledger .ln b{display:block;font-weight:400;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:1px;letter-spacing:.02em}
.ledger .gain .ln b{color:var(--crimson)}
.facts{display:flex;flex-direction:column;margin-top:2px}

<!-- 1 · HOW TO READ / CONTENTS -->
<template data-spread data-title="Contents" data-thread="M 0 34 C 120 16, 220 52, 330 34 S 470 16, 500 60 S 540 16, 620 34 S 860 52, 1000 26" data-knot="620,34">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Before you turn the page</p>
      <h2>Why a book, <em>not a deck</em></h2>
      <p class="lead" style="font-size:20px">A deck is shown once, and then it sleeps in a folder. A book stays on the desk. It gets opened on a slow afternoon, written in, argued with, handed to the next person who joins. That is what we'd like to leave with Pathos: something that keeps working when people, tools and vendors change. Including us.</p>
      <p>In German, the through-line of a story is called the <em>roter Faden</em>, the red thread. One is sewn across every page here. It stands for the question behind every decision in this book: <strong>does this make Pathos better at being Pathos?</strong> Same people. Better work. More of the week on the parts only a human can do.</p>
      <p>Every page tells its part on its own. A red pin<button class="pin" data-note="how" aria-label="Open note">i</button> opens a note where you'd like more. Read them, or skip them.</p>
      <div class="notes">
        <section data-note="how" data-title="How the notes work">
          <p>Each page is written to be complete at a glance: what we heard, what we'd do, and why. The pins hold the next layer down. Examples, mechanics, the questions we'd ask. Nothing in a note is needed to follow the thread.</p>
          <p>Every chapter also ends with a line addressed to you or to Alex. Those are the places where we'd most like to be corrected before the next version.</p>
        </section>
      </div>
      <div class="margin"><div class="who">In the margin</div><p>Read it in ten minutes. Argue with it over a coffee.</p></div>
      <div class="folio"><span>Tribune · The Red Thread</span><span class="n">02</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">Contents</p>
      <div class="toc" id="toc"></div>
      <div class="margin"><div class="who">At a glance</div><p><a href="https://tribuneinc.com/pathos/appendix" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--crimson)">Here is a shorter version</a> <span style="color:var(--crimson)">›</span></p></div>
      <div class="folio"><span class="n">03</span><span>Contents</span></div>
    </div>
  </div>
</template>

<!-- 2 · CHAPTER 1 · WHAT WE HEARD -->
<template data-spread data-title="What we heard" data-chapter="1" data-desc="What stayed with us, and the thesis in three lines." data-thread="M 0 36 C 60 22, 110 48, 150 34 L 150 34 C 260 16, 380 56, 500 60 S 620 16, 720 36 S 900 52, 1000 30" data-knot="150,34">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter one</p>
      <h2>What we <em>heard</em></h2>
      <p class="lead" style="font-size:19px">What stayed with us after the first conversation. Not a record, a starting point to sharpen together before anything gets built.</p>
      <div class="heard">
        <div><i class="k"></i><div><b>Human touch points.</b><span>The repetitive work can go. The idea, the judgment and the relationship stay with the person.</span></div></div>
        <div><i class="k"></i><div><b>Better, not fewer.</b><span>Every person gets more reach, nobody gets replaced, and Pathos keeps pace with the agencies already using these tools well.</span></div></div>
        <div><i class="k"></i><div><b>No tool carousel.</b><span>Stay current without the team relearning a new tool every other month.</span></div></div>
        <div><i class="k"></i><div><b>Knowledge that stays.</b><span>When someone moves on, their way of working stays in the house for whoever comes next.</span></div></div>
        <div><i class="k"></i><div><b>Thirty hours, three hours.</b><span>When the same work takes a tenth of the time, what does the invoice say?</span></div></div>
      </div>
      <p class="small" style="margin-top:8px">Why these five belong together<button class="pin" data-note="why" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="why" data-title="Why these five belong together">
          <p>They are one story seen from five sides. When the purpose of a tool is written down, the tool can change without the team starting over. When a way of working lives in the house and not only in one person, it stays when they move on. When the value of the work is named, pricing stops feeling like a guess. And human touch points is the test Pathos already applies: the one that decides whether any of this was worth it.</p>
          <p>The first step is simply writing down what already works well at Pathos. Everything else attaches to that.</p>
        </section>
      </div>
      <div class="folio"><span>Chapter one</span><span class="n">04</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">The thesis</p>
      <h2 class="s">Process over person.<br>Capability over tool.<br><em>Value over hours.</em></h2>
      <p><strong>Process over person.</strong> The way Pathos already works gets written down once, per process, so it belongs to the agency as much as to the people who shaped it. New colleagues learn it, experienced ones refine it, and it stays when someone moves on.<button class="pin" data-note="pop" aria-label="Open note">i</button></p>
      <p><strong>Capability over tool.</strong> Each process names the kind of help it needs, not the brand of software. The tool is a field you can change. The process is the thing you keep.</p>
      <p><strong>Value over hours.</strong> The client pays for what the work makes possible, not for the time it took. The hour becomes an internal number. That is what lets Pathos talk about price with a straight back.</p>
      <div class="notes">
        <section data-note="pop" data-title="Process over person, in practice">
          <p>A new hire is onboarded to <em>"how Pathos does client intake"</em>, not to one colleague's habits and not to a tool. The process entry carries the steps, the examples, and the notes of everyone who has run it. The handover is opening a chapter, not a drawer.</p>
          <p>Just as important: a new idea, from a person or from an AI, becomes "the standard" only once the team has looked at it. That keeps the good variations and lets everyone benefit from them.</p>
        </section>
      </div>
      <div class="margin"><div class="who">In the margin</div><p>Which single piece of work, if it took a tenth of the time tomorrow, would change how your week feels?</p></div>
      <div class="folio"><span class="n">05</span><span>The thesis</span></div>
    </div>
  </div>
</template>

<!-- CHAPTER 2 · TWO DOCUMENTS BEFORE ONE BUILD -->
<template data-spread data-title="Say it before you build it" data-chapter="1" data-desc="Two documents before one build, for us and for your clients." data-thread="M 0 34 C 90 18, 200 54, 300 36 L 300 36 C 400 20, 460 30, 500 60 S 620 18, 720 36 S 900 52, 1000 30" data-knot="300,36">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter two</p>
      <h2>Say it before <em>you build it</em></h2>
      <p class="lead" style="font-size:20px">Something that stuck with us from the meeting. Shane raised this, and it matched something we live by: before anything is built, two documents exist, written by two different people.</p>
      <div class="twodocs">
        <div class="doc">
          <div class="dh"><span class="no">01</span><b>The Requirements Book</b></div>
          <div class="by">Written by whoever needs the work</div>
          <ul><li>What must be achieved, and why</li><li>What "done" looks like, in outcomes</li><li>Time, budget, taste, and what must not change</li></ul>
        </div>
        <div class="arrow"><span>agreed</span></div>
        <div class="doc">
          <div class="dh"><span class="no">02</span><b>The Delivery Book</b></div>
          <div class="by">Written by whoever builds it</div>
          <ul><li>How it will be achieved</li><li>The steps, the tools, the people</li><li>Who owns what, and how we'll know it's done</li></ul>
        </div>
      </div>
      <p class="small" style="margin-top:10px">The first says <em>what</em>. The second says <em>how</em>. Both are agreed before the first hour of building.<button class="pin" data-note="docs" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="docs" data-title="Why two, and why in that order">
          <p>When the person who needs the work also writes how it should be built, they tend to describe a solution they already have in mind, and the builder inherits it. When the builder writes what is needed, the need quietly bends toward what is easy to build. Two authors keep both honest.</p>
          <p>The order matters too. Requirements first, then delivery, then sign-off on both. After that, a change to one is a change to the other, in writing. That habit is what keeps small additions from quietly growing into a second project.</p>
        </section>
      </div>
      <div class="folio"><span>Chapter two</span><span class="n">06</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">In both directions</p>
      <p class="lead">The same two documents work between Tribune and Pathos, and between Pathos and its clients.</p>
      <p><strong>Between us.</strong> This book is the beginning of the first document: what Pathos needs, in Pathos's words. The next version, with your notes folded in, becomes the requirements. Our delivery book follows: approach, steps, who does what, and what done looks like. Nothing gets built before both are agreed.</p>
      <p><strong>Between Pathos and a client.</strong> This is where value-based pricing becomes easy to say yes to. The client's brief becomes the requirements: outcomes, not hours. Pathos's proposal becomes the delivery book: what will be delivered, by when, and how everyone will know it worked. The client signs off on outcomes. The hour never enters the conversation.</p>
      <p class="small">And once intake is a process in the registry, the first draft of both documents can come out of the kickoff call itself, ready for a human to shape.</p>
      <div class="margin"><div class="who">In the margin</div><p>You mentioned this in the meeting. Let's nail it down together: how do you handle this part today, and where would you like the details to go?</p></div>
      <div class="folio"><span class="n">07</span><span>Two documents</span></div>
    </div>
  </div>
</template>

<!-- CHAPTER 3 · THE BOOK ITSELF -->
<template data-spread data-title="The book itself" data-chapter="1" data-desc="Four layers: registry, automation map, ledger, feedback loop." data-thread="M 0 32 C 80 16, 120 48, 160 34 S 380 16, 500 60 S 640 16, 760 38 S 940 52, 1000 26" data-knot="160,34">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter three</p>
      <h2>The book <em>itself</em></h2>
      <p class="lead">Not a wiki, not a tool. Four layers that hold each other up, each one a real thing you can open and read.</p>
      <div class="layers">
        <div class="layer"><div class="no">01</div><div><b>Process Registry</b><span>What Pathos does, task by task, written down and kept current.<button class="pin" data-note="reg" aria-label="Open note">i</button></span></div></div>
        <div class="layer"><div class="no">02</div><div><b>Automation Map</b><span>Per process: which kind of help, which tool today, and where it changed.<button class="pin" data-note="map" aria-label="Open note">i</button></span></div></div>
        <div class="layer"><div class="no">03</div><div><b>Economics Ledger</b><span>Per process: what it took to build, what it costs to run, what it made possible.<button class="pin" data-note="ledger" aria-label="Open note">i</button></span></div></div>
        <div class="layer"><div class="no">04</div><div><b>Feedback loop</b><span>Better ways get proposed, looked at, and promoted into the standard.<button class="pin" data-note="loop" aria-label="Open note">i</button></span></div></div>
      </div>
      <div class="notes">
        <section data-note="reg" data-title="One registry entry, illustrative">
          <div class="row"><div class="k">Process</div><div class="v">MKT-004 · Client onboarding, website scope intake</div></div>
          <div class="row"><div class="k">Owner</div><div class="v">Account management lead</div></div>
          <div class="row"><div class="k">Trigger</div><div class="v">New client signed</div></div>
          <div class="row"><div class="k">Steps</div><div class="v">Kickoff call (human) → notes to structured brief (machine, human review) → scope and estimate draft (machine + lead) → client sign-off (human)</div></div>
          <div class="row"><div class="k">Status</div><div class="v"><span class="tag">partially automated</span></div></div>
          <div class="row"><div class="k">Training</div><div class="v">6-minute video · checklist · two worked examples</div></div>
          <div class="row"><div class="k">Version</div><div class="v">1.3, promoted from a team suggestion, reason logged</div></div>
        </section>

          <div class="legend"><span><i style="opacity:.92"></i>Strong</span><span><i style="opacity:.6"></i>Good</span><span><i style="opacity:.28"></i>Some</span><span><i style="opacity:.08"></i>Stays human</span></div>
          <div class="heat">
            <div></div><div class="h">Advise</div><div class="h">Develop</div><div class="h">Design</div><div class="h">Capture</div><div class="h">Experience</div>
            <div class="rl">Research</div><div class="c h3"></div><div class="c h2"></div><div class="c w"></div><div class="c w"></div><div class="c h2"></div>
            <div class="rl">First drafts</div><div class="c h2"></div><div class="c h3"></div><div class="c h2"></div><div class="c w"></div><div class="c h2"></div>
            <div class="rl">Versions &amp; formats</div><div class="c w"></div><div class="c h3"></div><div class="c h3"></div><div class="c h3"></div><div class="c h2"></div>
            <div class="rl">Reporting &amp; QA</div><div class="c h3"></div><div class="c h2"></div><div class="c w"></div><div class="c w"></div><div class="c h3"></div>
            <div class="rl">Client touch points</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
            <div class="rl">The idea</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
          </div>
          <p>Drawn from the outside, using the five ways Pathos describes its work on wearepathos.com. The real map comes out of the pilot department, with the people who do the work. What stays human is not a limitation of the tools. It is the choice this whole book is built on.</p>
        </section>
        <section data-note="ledger" data-title="Process first, cost later">
          <p>We'd write the process down and see it run before anyone talks about what automation costs or saves. The number only means something once it describes a real process, not a hoped-for one.</p>
          <p>And there is more than one way to start: one process, one department, one tool slot. Add the next one once the value is visible to everyone in the room, not just to us. The ledger is there so that each step can be judged on its own before the next one is taken.</p>
        </section>
        <section data-note="loop" data-title="The loop, step by step">
          <ul>
            <li>Someone finds a better way: a prompt, a shortcut, a tool.</li>
            <li>They propose it as a <em>candidate</em> against the process, not as a live edit.</li>
            <li>A named reviewer looks at it against what the process is meant to achieve.</li>
            <li>Approved: the entry moves forward, with who, what and why. Not approved: it stays logged with the reason, so nobody argues it again from zero.</li>
          </ul>
          <p>The loop is what keeps the book alive instead of turning it into a binder.</p>
        </section>
      </div>
      <div class="folio"><span>Chapter three</span><span class="n">06</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">What Pathos owns at the end</p>
      <p class="lead">The registry is the asset. Everything underneath it, tools, vendors, even us, can be replaced.</p>
      <p>It deserves to exist even for processes that will never be automated. Much of how Pathos works lives with Alex and with experienced colleagues, as it does in every good agency. Writing it down is half the value on its own.</p>
      <p>The registry lives in your accounts, on your hardware, in a form that doesn't depend on any one product. If Tribune disappeared tomorrow, the book would still be on the shelf, and the people who wrote it would still know how to read it.</p>
      <div class="margin"><div class="who">In the margin</div><p>What already exists today: SOPs, a wiki, Notion, or mostly heads? That decides whether we start by writing things down or by tidying up what's there.</p></div>
      <div class="folio"><span class="n">07</span><span>The four layers</span></div>
    </div>

<!-- 4 · CHAPTER 3 · CURRENT, NOT CHURNING -->
<template data-spread data-title="Tools that don't churn" data-chapter="1" data-desc="Staying current without the tool carousel." data-thread="M 0 28 C 90 14, 200 52, 320 36 S 470 16, 500 60 S 590 18, 640 36 L 640 36 C 760 56, 900 18, 1000 34" data-knot="640,36">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter four</p>
      <h2>Current, <em>not churning</em></h2>
      <p class="lead">Staying current without switching tools every other month isn't only about picking better tools. It's about making sure the tool is never the thing the work depends on.</p>
      <p><strong>We name the job, not the vendor.</strong> Each process asks for a kind of help: drafting, research, orchestration, reporting. The product in each slot is one line in the map. Prompts, checklists and training live in the book, so they survive a swap.<button class="pin" data-note="slots" aria-label="Open note">i</button></p>
      <p><strong>One quarterly question per slot:</strong> is there something clearly better now? If the gain is worth the cost of switching, swap it and write it down. If not, keep what works, and write that down too.</p>
      <div class="notes">
        <section data-note="slots" data-title="The slots, illustrative">
          <div class="row"><div class="k">Orchestration</div><div class="v">OpenClaw today, owned and on your hardware. Built to stay, built to be replaceable.</div></div>
          <div class="row"><div class="k">Drafting</div><div class="v">The current best model, through the orchestrator. Easy to swap, the prompts live in the book.</div></div>
          <div class="row"><div class="k">Research</div><div class="v">The current best model plus the web. Easy to swap.</div></div>
          <div class="row"><div class="k">Workflow glue</div><div class="v">Whatever is already in use (n8n, Make, internal). Moderate.</div></div>
          <div class="row"><div class="k">Reporting</div><div class="v">The existing stack first. Moderate.</div></div>
          <div class="row"><div class="k">Media</div><div class="v">The team's choice. Easy.</div></div>
          <p style="margin-top:10px">Every swap gets a line: when, why, what it cost. "We're not locked in" stops being a promise and becomes a track record.</p>
        </section>
      </div>
      <div class="folio"><span>Chapter four</span><span class="n">08</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">Where the orchestrator sits</p>
      <p class="lead">The orchestrator is the part that connects everything else. Today, that is OpenClaw, running on hardware Pathos owns.</p>
      <p>It is built to stay for a long time, and built so that it doesn't have to. The processes, the prompts and the training live in the book, not inside the orchestrator. Models and tools plug into it and get swapped as better ones appear. And if, one day, something better comes along for the orchestrator itself, Pathos can move without starting over.</p>
      <p>That is the difference between being current and being churned: the surface keeps changing, the foundation doesn't, and neither one holds you hostage.</p>
      <div class="margin"><div class="who">In the margin</div><p>What have you already built: APIs, MCP connections, internal tooling? We'd much rather build on it than around it.</p></div>
      <div class="folio"><span class="n">09</span><span>Automation map</span></div>
    </div>
  </div>
</template>

<!-- 5 · CHAPTER 4 · WHERE THE HUMAN STAYS -->
<template data-spread data-title="Where the human stays" data-chapter="1" data-desc="Human touch points, and training that outlives the person." data-thread="M 0 36 C 80 20, 180 54, 300 34 S 470 18, 500 60 S 640 22, 720 38 L 720 38 C 820 52, 920 20, 1000 32" data-knot="720,38">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter five</p>
      <h2>Where the <em>human</em> stays</h2>
      <p class="lead">The line gets drawn per process, together with the people who do the work. But here is the shape of it.</p>
      <div class="split">
        <div class="hum"><h4>Stays with the person</h4><ul>
          <li>The client relationship</li><li>The idea, the angle, the taste</li><li>The brief and the final call</li><li>The pitch room</li><li>Saying no to a machine's draft</li>
        </ul></div>
        <div class="mac"><h4>Goes to the machine first</h4><ul>
          <li>First drafts, variants, resizes</li><li>Research and competitive scans</li><li>Reporting and status updates</li><li>Meeting notes into tasks</li><li>QA and consistency passes</li>
        </ul></div>
      </div>
      <p class="small" style="margin-top:14px">Success isn't fewer people. It's how much of the week moved from the right column back into the left.</p>
      <div class="folio"><span>Chapter five</span><span class="n">10</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">Training that outlives the person</p>
      <p class="lead">Trained once per process, not once per employee.</p>
      <p>Training hangs off the process, not off a tool and not off a person. In practice that means two homes for it: a learning space for the team, in the spirit of LearnWorlds or Skool, with short videos and the "why" behind each step; and a Pathos knowledge base, think of it as Pathos's own Wikipedia, where every process, its history and everyone's notes live.<button class="pin" data-note="train" aria-label="Open note">i</button></p>
      <div class="loop4">
        <div><b>Learn</b><span>The chapter, a short video, curated resources.</span></div>
        <div><b>Do</b><span>Run the process with today's tool.</span></div>
        <div><b>Write back</b><span>What you did, what you'd change.</span></div>
        <div><b>Promote</b><span>Looked at. Becomes the standard.</span></div>
      </div>
      <div class="notes">
        <section data-note="train" data-title="And, quietly, a second audience">
          <p>After running a process, the person adds a short note to the entry: what actually happened, where the instructions were wrong, what they'd do differently. Those notes are the raw material of the next version, and they are what a successor reads on day one.</p>
          <p>Once the book exists, some of it can face outward. How Pathos works with these tools, and where it deliberately keeps the human in the loop, is a story clients will increasingly want to hear. Not a strategy yet. Just a door we'd leave open.</p>
          <p>Whether the learning side is videos, a resource library, or something else is deliberately open. We'd rather decide it with the team than for it.</p>
        </section>
      </div>
      <div class="margin"><div class="who">In the margin</div><p>Who gets to say "this is now how we do it": department leads, Alex, you?</p></div>
      <div class="folio"><span class="n">11</span><span>Training loop</span></div>
    </div>
  </div>
</template>

<!-- 6 · CHAPTER 5 · THIRTY HOURS, THREE HOURS -->
<template data-spread data-title="Thirty hours, three hours" data-chapter="1" data-desc="From hours to value, and how an agency makes the switch." data-thread="M 0 30 C 70 16, 120 50, 170 34 L 170 34 C 300 16, 420 56, 500 60 S 660 16, 780 36 S 930 52, 1000 28" data-knot="170,34">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter six</p>
      <h2>Thirty hours, <em>three hours</em></h2>
      <p class="lead">Everyone in the room already knows the answer is value-based pricing. The hard part was never the idea. It's moving an agency, and its clients, from a world that counted hours to one that counts what the work makes possible.</p>
      <p>Think of how Apple prices a phone. The technology has to be excellent; that is the foundation. But nobody pays that price for the components. They pay for the design, the experience, and the trust in the name. Pathos already has the reputation for great work. AI now lets the same people do it faster and better, without losing the quality.</p>
      <p><strong>The client shouldn't be left thinking "that must have made them faster."</strong> The client should think: "look what this campaign, this design, this site did for my business."<button class="pin" data-note="msg" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="msg" data-title="Where the message shifts">
          <div class="row"><div class="k">Instead of</div><div class="v">"A website in six weeks."</div></div>
          <div class="row"><div class="k">Say</div><div class="v">"A site that starts converting in week two."</div></div>
          <div class="row"><div class="k">Instead of</div><div class="v">"Forty hours of design."</div></div>
          <div class="row"><div class="k">Say</div><div class="v">"Three directions on your desk by Friday."</div></div>
          <div class="row"><div class="k">Instead of</div><div class="v">"Two rounds of revisions included."</div></div>
          <div class="row"><div class="k">Say</div><div class="v">"We'll get to the right answer faster."</div></div>
          <p style="margin-top:10px">Same craft, same people. The invoice just stops describing effort and starts describing outcome. Pathos's own messaging is the first place this shows up.</p>
        </section>
      </div>
      <div class="folio"><span>Chapter six</span><span class="n">12</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">How an hourly agency makes the switch</p>
      <div class="heard">
        <div><i class="k"></i><div><b>New packages.</b><span>Outcome-shaped offers at a fixed price: a launch, a campaign season, a brand refresh. The hour stops being the unit.</span></div></div>
        <div><i class="k"></i><div><b>Client education.</b><span>Tell clients how Pathos works now, in their language. Never "less work". Always "more of what you came for".</span></div></div>
        <div><i class="k"></i><div><b>Start where it's easy.</b><span>New clients and new services first. Existing retainers move when their scope changes.</span></div></div>
        <div><i class="k"></i><div><b>Measure what the client feels.</b><span>Days to first draft, directions shown, results after launch. Effort stays an internal number.<button class="pin" data-note="ledger2" aria-label="Open note">i</button></span></div></div>
      </div>
      <div class="stack">
        <div class="col old"><div class="cap">What the invoice described</div><div class="blk g big"><span class="strike">Hours × rate</span><small>The effort, itemised</small></div></div>
        <div class="col new"><div class="cap">What it describes now</div><div class="blk">The outcome<small>what the work did for the business</small></div><div class="blk">The craft<small>the quality Pathos is known for</small></div><div class="blk">The speed<small>directions on Friday, not next month</small></div></div>
      </div>
      <div class="notes">
        <section data-note="ledger2" data-title="What the internal ledger still tracks">
          <p>Behind the scenes, Pathos still needs to know its own numbers: hours before and after, what an automation cost to build and costs to run, and whether quality held. That is how the agency knows its margin and which processes are worth scaling.</p>
          <p>Those numbers never become the reason for a price. They are the reason Pathos can offer the price with confidence.</p>
        </section>
      </div>
      <div class="margin"><div class="who">In the margin</div><p>Which service would you feel comfortable repackaging first?</p></div>
      <div class="folio"><span class="n">13</span><span>Value over hours</span></div>
    </div>

</template>

<!-- CHAPTER 6 · THE OTHER SIDE OF THE LEDGER -->
<template data-spread data-title="The other side of the ledger" data-chapter="1" data-desc="What it costs, what it earns, and what the numbers say so far." data-thread="M 0 34 C 90 18, 200 54, 300 36 S 470 18, 500 60 S 600 20, 700 36 L 700 36 C 800 52, 900 20, 1000 32" data-knot="700,36">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter seven</p>
      <h2>The other side <em>of the ledger</em></h2>
      <p class="lead" style="font-size:20px">Pricing is a challenge worth solving. The opportunity is why it's worth solving. AI has a cost, and it belongs on one side of the page. What it makes possible belongs on the other, in the same size.</p>
      <div class="ledger">
        <div class="col cost"><div class="cap">What it costs</div>
          <div class="ln"><span>Models and tools</span><b>hundreds to a few thousand a month, per team</b></div>
          <div class="ln"><span>Setting it up</span><b>days per process, once</b></div>
          <div class="ln"><span>Learning it</span><b>a few hours per person, per process</b></div>
          <div class="ln"><span>Keeping a human in the loop</span><b>stays, by design</b></div>
        </div>
        <div class="col gain"><div class="cap">What it earns</div>
          <div class="ln"><span>Hours back, per person, per week</span><b>the single biggest number</b></div>
          <div class="ln"><span>More directions, faster answers</span><b>what clients notice</b></div>
          <div class="ln"><span>More clients at the same headcount</span><b>growth without hiring first</b></div>
          <div class="ln"><span>Price on outcome, not hours</span><b>margin that stays in the house</b></div>
        </div>
      </div>
      <p class="small" style="margin-top:10px">A worked example, in Pathos's shape<button class="pin" data-note="worked" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="worked" data-title="A worked example, illustrative">
          <p>Take one team of five. If roughly a third of the week goes to first drafts, versions, resizes, research and reporting, and the machine takes the first pass at that, each person gets back about half a day a week. Across the team that is around 100 hours a month.</p>
          <p>A hundred hours is one or two more client projects a month, at the same headcount, or the same projects with three directions on the table instead of one. Priced on outcome rather than hours, that capacity becomes revenue instead of a discount.</p>
          <p>These are the numbers we'd rather calculate together in month one, on real Pathos work, than estimate from the outside.</p>

      </div>
      <div class="folio"><span>Chapter seven</span><span class="n">14</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <p class="eyebrow g">What the numbers say so far</p>
      <div class="facts">

        <div class="fact"><b>3 to 15% revenue uplift</b><span>Companies investing in AI for marketing and sales, with a 10 to 20% uplift in sales ROI. McKinsey, 2023.</span><a href="https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/ai-powered-marketing-and-sales-reach-new-heights-with-generative-ai" target="_blank" rel="noopener">mckinsey.com</a></div>

        <div class="fact"><b>Only 6% treat it as a line of business</b><span>87% of US agencies use gen AI, 81% for productivity, but 61% still see it as a cost of doing business. That gap is the opening. Forrester with the 4As, April 2026.</span><a href="https://www.mediapost.com/publications/article/416324/report-agencies-using-ai-to-boost-margins-are-sac.html" target="_blank" rel="noopener">4As / Forrester</a></div>
      </div>
      <p class="small" style="margin-top:8px">One more number to keep in view: 27% of agencies have already been asked by clients to lower prices because of AI. Which is why chapter six comes before this one.</p>
      <div class="margin"><div class="who">In the margin</div><p>Which of these would you like to see calculated on Pathos's own numbers first?</p></div>

<!-- CHAPTER 7 · FROM STRATEGY TO A SECOND BRAIN -->
<template data-spread data-title="From strategy to a second brain" data-chapter="1" data-desc="Company strategy, an operator per person, then a second brain." data-thread="M 0 34 C 100 18, 220 54, 340 36 S 470 16, 500 60 S 600 22, 660 36 L 660 36 C 790 56, 900 18, 1000 34" data-knot="660,36">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter eight</p>
      <h2>From strategy to a <em>second brain</em></h2>
      <p class="lead">Three steps, in this order. Each one only makes sense because the one before it is real.</p>
      <div class="steps">
        <div class="step"><div class="no">01</div><div><b>The company strategy</b><span>Where Pathos wants to be in three years, and which processes carry it there. The book, the pilot department, the plan. Nothing gets built before this is clear. Jeff leads this.</span></div></div>
        <div class="step"><div class="no">02</div><div><b>An operator for each person</b><span>Not one big system. An OpenClaw assistant per role: intake, design, content, reporting. Set up with the person, trained on their process, improving with their notes.</span></div></div>
        <div class="step"><div class="no">03</div><div><b>A second brain for leadership</b><span>Once the first two carry real signal, the layer Ryan runs today becomes possible for Shane and the department heads. Research done, options laid out, the call still yours.<button class="pin" data-note="copilot" aria-label="Open note">i</button></span></div></div>
      </div>
      <div class="notes">
        <section data-note="copilot" data-title="What a second brain does, day to day">
          <ul>
            <li><strong>Research</strong>: market, competitor and client context before the meeting, not after.</li>
            <li><strong>Options</strong>: three ways to do it, costed from the ledger rather than from memory.</li>
            <li><strong>A live view</strong>: what's on track, stalled or trending across departments, without anyone compiling an update.</li>
            <li><strong>A voice that disagrees</strong>: someone whose only job is to argue the other side before a big decision.</li>
          </ul>
          <p>The person still makes the call. That isn't a caveat, it is the design.</p>
        </section>
      </div>
      <div class="folio"><span>Chapter eight</span><span class="n">14</span></div>
    </div>
  </div>
  <div class="r">
    <div class="inner">
      <span class="pill">How Ryan runs it today</span>
      <p class="lead">At Maxximus AI, Ryan works with a full C-suite of AI colleagues.</p>
      <p>Marcus, the CEO, reads everything before Ryan does and turns a morning's brain dump into a plan. Themis, the general counsel, flags exposure before it becomes a problem. Mercury holds the numbers, Sophia the brand, Sophos the technology. And when a big decision is on the table, Momus is brought in to argue against it.</p>
      <div class="pack-stat">
        <div><b>$1.7M&ndash;$2.6M</b><span>market salary for that team, per year</span></div>
        <div><b class="c">$1K&ndash;$3K</b><span>what Ryan actually pays, per month</span></div>
      </div>
      <p>They talk to each other in a shared room the team calls The Den. Ryan decides everything that can't be undone. In the follow-up he'll show it live.<button class="pin" data-note="pack" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="pack" data-title="The pack, in one table">
          <div class="pack">
            <div><b>Marcus</b><span>Chief Executive Officer · reviews every output, sets the week</span><span class="sal">$250K&ndash;$400K/yr</span></div>
            <div><b>Sophos</b><span>Chief Technology Officer · architecture, reliability</span><span class="sal">$220K&ndash;$350K/yr</span></div>
            <div><b>Mercury</b><span>Chief Financial Officer · the numbers, always</span><span class="sal">$200K&ndash;$300K/yr</span></div>
            <div><b>Sophia</b><span>Chief Marketing Officer · brand, content, growth</span><span class="sal">$180K&ndash;$280K/yr</span></div>
            <div><b>Ares</b><span>Chief Revenue Officer · from attention to revenue</span><span class="sal">$180K&ndash;$260K/yr</span></div>
            <div><b>Prometheus</b><span>AI Engineer · the knowledge engine</span><span class="sal">$200K&ndash;$320K/yr</span></div>
            <div><b>Themis</b><span>General Counsel · IP, privacy, contracts</span><span class="sal">$180K&ndash;$280K/yr</span></div>
            <div><b>Cerberus</b><span>Head of Security · finds the holes first</span><span class="sal">$180K&ndash;$260K/yr</span></div>
            <div><b>Momus</b><span>Devil's Advocate · votes no until proven wrong</span><span class="sal">$150K&ndash;$200K/yr</span></div>
          </div>
          <div class="pack-total"><b>Total, market rate</b><span>$1,740,000&ndash;$2,650,000/yr</span></div>
          <p style="margin-top:12px">The flow: Ryan drops a direction. Marcus turns it into a plan and hands it to the right colleague. They execute. Marcus reviews. Ryan decides on anything irreversible. On the open market, that team costs $1.74M&ndash;$2.65M a year in salary. Ryan runs it for roughly $1,000&ndash;$3,000 a month in API calls &mdash; the cost of one junior employee's day, per month, for the whole team.</p>
          <p>Pathos's version will look different. It should be shaped around how Shane and the department heads actually decide, not copied over.</p>
        </section>
      </div>
      <div class="margin"><div class="who">In the margin</div><p>Which decision this month would you have liked a second brain on?</p></div>
      <div class="folio"><span class="n">15</span><span>The second brain</span></div>
