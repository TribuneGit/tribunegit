<template data-spread data-title="How we work" data-thread="M 0 32 C 100 18, 200 52, 300 36 S 470 18, 500 60 S 600 20, 700 36 L 700 36 C 800 52, 900 20, 1000 32" data-knot="700,36">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter eight, continued</p>
      <span class="pill">How Jeff works today</span>
      <p class="lead">Jeff runs his own work through two AI operators and a council.</p>
      <p>HAL and ZUZE are two OpenClaw operators, each on its own server, doing the same kind of work: websites, Make.com automations, Supabase backends, AI video, research. They share one memory through Supabase, so what one learns, the other knows by the next morning. Often they run side by side to get through work faster; for a day or two one becomes the specialist in a subject, until the knowledge is exchanged overnight.</p>
      <p>Neither of them builds everything alone. Work is routed to specialist agents, reviewed, and only what needs Jeff's decision reaches him. Before a decision that is hard to undo, the Senate meets: models from different providers argue the case as architect, skeptic, adversary and arbiter.<button class="pin" data-note="jeffsys" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="jeffsys" data-title="What gets built with them">
          <div class="row"><div class="k">Websites</div><div class="v">Designed and built from a brief to a live site. See wall-r.com, ai-filings.com and sierrawebstudios.com.</div></div>
          <div class="row"><div class="k">Automation</div><div class="v">Make.com and n8n pipelines: intake, warehouse and e-commerce flows, media processing, publishing.</div></div>
          <div class="row"><div class="k">Backends</div><div class="v">Supabase systems such as the AI Filings CMS at ai-filings.com: data, roles, documents, workflow.</div></div>
          <div class="row"><div class="k">Video</div><div class="v">fal.ai and GPU pipelines with voice synthesis, for websites and social channels; one source, many formats.</div></div>
          <div class="row"><div class="k">Specialists</div><div class="v">Five agents with lasting memory: websites, video and GPU work, integrations and automation, legal drafting, finance. Short-lived workers do the execution and are retired.</div></div>
          <div class="row"><div class="k">Judgment</div><div class="v">The Senate for decisions that matter; a ladder of trust for agents, from observer to operator, earned by reliability.</div></div>
          <p style="margin-top:10px">The rhythm is always the same: explore, research, challenge, architect, document, build, test, observe, revise. Nothing is assumed right until it has run in the real world.</p>
        </section>
      </div>
      <div class="margin"><div class="who">In the margin</div><p>This is the setup we'd build with each person at Pathos, sized to their role. Where would you like to see it first?</p></div>
      <div class="folio"><span>How Jeff works</span><span class="n">00</span></div>
    </div>

      <p class="eyebrow g">What that looks like at Pathos</p>

<template data-spread data-title="Who you'd be working with" data-chapter="1" data-desc="Jeff and Ryan, briefly." data-thread="M 0 32 C 90 18, 190 52, 290 36 S 470 18, 500 60 S 610 20, 710 36 S 900 52, 1000 32" data-knot="290,36">
  <div class="l">
    <div class="inner">
      <p class="eyebrow">Chapter eleven</p>
      <h2>Who you'd be <em>working with</em></h2>
      <div class="person">
        <div class="photo" aria-label="Photo of Jeffrey Reinhold">JR</div><!-- HAL: replace with LinkedIn profile photo (https://www.linkedin.com/in/jeffrey-reinhold/), <img class="photo" src="..."> -->
        <div><div class="role">Co-founder &amp; CTO · Strategy · OpenClaw</div><h3>Jeffrey Reinhold</h3>
          <div class="links"><a href="https://sierrawebstudios.com/" target="_blank" rel="noopener">sierrawebstudios.com</a><a href="https://www.horizon.space/" target="_blank" rel="noopener">horizon.space</a><a href="https://www.linkedin.com/in/jeffrey-reinhold/" target="_blank" rel="noopener">LinkedIn</a></div>
        </div>
      </div>
      <p>Jeff is Tribune's co-founder and CTO. He designs AI-enabled operating systems for real businesses, through Quantum Horizons, Horizon Space and Sierra Web Studios. The principle is simple: automation handles the predictable, AI handles the complex, and humans stay responsible for what matters.</p>
      <p>His own work runs through two OpenClaw operators, HAL and ZUZE, sharing what they learn. Bilingual in English and German, based in West Palm Beach.<button class="pin" data-note="jeff" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="jeff" data-title="How Jeff approaches a client system">
          <ul>
            <li><strong>Understand the actual business.</strong> What happens today, where information starts, who touches it, where time disappears.</li>
            <li><strong>Find the real constraint.</strong> A company asking for "AI" often has disconnected data, duplicate entry, or knowledge trapped in people's heads.</li>
            <li><strong>Separate the work.</strong> Human judgment, AI reasoning, automation, conventional software. Each gets what it's good at.</li>
            <li><strong>Connect the system.</strong> Pipelines, agents, interfaces and controls, end to end.</li>
            <li><strong>Observe reality.</strong> The first version isn't assumed to be right. Watch it, measure it, improve it.</li>
          </ul>
          <p>One more idea Pathos will hear about: authority is earned. An agent starts as an observer and gains responsibility as it proves reliable, the way a good junior colleague would.</p>
        </section>
      </div>
      <div class="folio"><span>Chapter eleven</span><span class="n">20</span></div>
    </div>
  </div>

      <p class="eyebrow g">And</p>
      <div class="person">
        <div class="photo" aria-label="Photo of Ryan Poole">RP</div><!-- HAL: replace with LinkedIn profile photo (https://www.linkedin.com/in/ryan-poole-0b50b9162/) -->
        <div><div class="role">Co-founder &amp; CEO · Leadership systems</div><h3>Ryan Poole</h3>
          <div class="links"><a href="https://maxximus.ai/" target="_blank" rel="noopener">maxximus.ai</a><a href="https://www.realtrade.io" target="_blank" rel="noopener">realtrade.io</a><a href="https://www.linkedin.com/in/ryan-poole-0b50b9162/" target="_blank" rel="noopener">LinkedIn</a></div>
        </div>
      </div>
      <p>Ryan is Tribune's co-founder and CEO. He founded Maxximus AI, and before that RealTrade, a marketplace and social platform that brings human connection back to real estate. Twenty-seven years in sales taught him which conversations can't be delegated: investors, partners, clients. Everything else, he decided, could be organised differently.</p>
      <p>So he built his company around an AI C-suite that reads, plans, drafts, reviews and argues, while he sets direction and makes the calls that can't be undone. Not automation, an organisation. That is the experience he brings to Pathos's leadership layer.<button class="pin" data-note="ryan" aria-label="Open note">i</button></p>
      <div class="notes">
        <section data-note="ryan" data-title="How a week runs at Maxximus AI">

          <path d="M 4 62 C 22 40, 36 84, 55 60 S 88 34, 106 58"/>

<script>
(function(){
  const tpls = [...document.querySelectorAll('template[data-spread]')];
  const spreads = tpls.map(t => ({
    title: t.dataset.title, thread: t.dataset.thread, chapter: t.dataset.chapter, desc: t.dataset.desc,
    knot: (t.dataset.knot || '').split(',').map(Number),

  }));
  const LAST = spreads.length - 1;
  const book = document.getElementById('book');
  const pL = document.getElementById('pL'), pR = document.getElementById('pR');
  const castL = document.getElementById('castL'), castR = document.getElementById('castR');

  function html(el){ return el ? el.innerHTML : ''; }

  function paint(page, side, i){
    const s = spreads[i]; const src = side === 'l' ? s.l : s.r;

  }
  function buildToc(page){
    const toc = page.querySelector('#toc'); if (!toc) return;
    toc.innerHTML = '';
    spreads.map((s,i)=>({s,i})).filter(o => o.s.chapter).forEach((o,k)=>{
      const b = document.createElement('button');
      b.innerHTML = `<span class="no">${String(k+1).padStart(2,'0')}</span><span class="t">${o.s.title}</span><span class="pg">${String(o.i*2).padStart(2,'0')}</span><span class="d">${o.s.desc || ''}</span>`;

    if (mFill) mFill.style.width = (LAST ? (cur/LAST*100) : 0) + '%';
    if (mLabel) mLabel.textContent = 'Page ' + (cur+1) + ' of ' + (LAST+1);
  }
  function show(i){
    cur = i; book.classList.remove('front-closed');
    if (i!==LAST) { book.classList.remove('back-closed'); book.style.transform=''; }
    else if (isDesk()) { book.classList.add('back-closed'); book.style.transform='translateX(-25%)'; }

  // ---- the tv: channels are the sites and profiles. Screen opens, knob advances, chips tune. ----
  const CHANNELS = [
    { n:1, kicker:'Ryan · Profile',   name:'Ryan Poole',         line:'Co-founder and CEO, Tribune. On LinkedIn.', url:'https://www.linkedin.com/in/ryan-poole-0b50b9162/', li:true },
    { n:2, kicker:'Jeff · Profile',   name:'Jeffrey Reinhold',   line:'Co-founder and CTO, Tribune. On LinkedIn.', url:'https://www.linkedin.com/in/jeffrey-reinhold/', li:true },
    { n:3, kicker:'Ryan · Company',   name:'Maxximus AI',        line:'Run by Ryan and a full AI C-suite, in The Den.', url:'https://maxximus.ai/' },
    { n:4, kicker:'Jeff · Studio',    name:'Sierra Web Studios', line:'Websites and AI video, built as the visible surface of a larger system.', url:'https://sierrawebstudios.com/', preview:true },
    { n:5, kicker:'Ryan · Founded',   name:'RealTrade',          line:'Real estate, made social. Human connection back at the heart of it.', url:'https://realtrade.io/' },
    { n:6, kicker:'Jeff · Systems',   name:'Horizon Space',      line:"We don't build tools. We build systems.", url:'https://www.horizon.space/', preview:true },
    { n:7, kicker:'Sample page · built by Jeff', name:'Wallr',      line:'A client site for a 3D concrete printing company.', url:'https://wall-r.com/', sample:true, preview:true },
    { n:8, kicker:'Sample page · built by Jeff', name:'AI Filings', line:'A filing portal and CMS on Supabase.', url:'https://ai-filings.com/', sample:true },
    { n:9, kicker:'Sample page · built by Jeff', name:'OngeaX',     line:'An AI voice gateway for the Kenyan market.', url:'https://ongeax.com/', sample:true }
  ];
  function tvRender(tv){
    const i = +tv.dataset.ch || 0, c = CHANNELS[i];
    tv.querySelector('.c-kicker').textContent = c.kicker;
    tv.querySelector('.c-name').innerHTML = c.name + (c.sample ? '<span class="badge">Sample</span>' : '');
    tv.querySelector('.c-line').textContent = c.line;
    const short = c.url.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');
    tv.querySelector('.c-url').textContent = short;
    tv.querySelector('.osd-n').textContent = c.n; tv.querySelector('.osd-l').textContent = c.name.toUpperCase();
    tv.querySelector('.knob').style.transform = 'rotate(' + (i * (330 / CHANNELS.length)) + 'deg)';
    const chips = tv.querySelector('.chips');
    if (!chips.children.length) CHANNELS.forEach((ch,k)=>{
      if (ch.sample && !(CHANNELS[k-1] && CHANNELS[k-1].sample)) { const g = document.createElement('div'); g.className='grp'; g.textContent='Sample pages'; chips.appendChild(g); }
      const b = document.createElement('button'); b.className = 'chip' + (ch.li ? ' li' : ''); b.dataset.k = k;
      b.innerHTML = (ch.li ? '<i>in</i>' : '') + ch.name; chips.appendChild(b);
    });
    [...chips.querySelectorAll('.chip')].forEach((b,k)=> b.classList.toggle('on', k===i));
    // live preview for the pages that allow it; the title card stays until the frame has loaded
    const tube = tv.querySelector('.tube');
    let pv = tube.querySelector('.pv'), cap = tube.querySelector('.cap');
    if (!cap) { cap = document.createElement('div'); cap.className='cap'; tube.appendChild(cap); }
    cap.innerHTML = '<span>' + c.n + ' · ' + c.name + (c.sample ? ' · sample' : '') + '</span><span>' + short + '</span>';
    tube.classList.remove('live');
    if (pv) pv.remove();
    if (c.preview && isDesk()) {
      pv = document.createElement('div'); pv.className='pv';
      const f = document.createElement('iframe'); f.loading='lazy'; f.title = c.name + ' preview'; f.setAttribute('aria-hidden','true'); f.tabIndex = -1;
      f.sandbox = 'allow-scripts allow-same-origin';
      pv.appendChild(f); tube.insertBefore(pv, tube.firstChild);
      const fit = ()=>{ const w = tube.clientWidth || 400, h = tube.clientHeight || 300, sc = w/1280; f.style.transform = 'scale(' + sc + ')'; f.style.height = Math.round(h/sc) + 'px'; };
      fit(); f.addEventListener('load', ()=>{ fit(); tube.classList.add('live'); });
      f.src = c.url;
    }
    // the channel index on the facing page
    const list = document.getElementById('chlist');
    if (list && !list.children.length) CHANNELS.forEach((ch,k)=>{
      if (ch.sample && !(CHANNELS[k-1] && CHANNELS[k-1].sample)) { const g = document.createElement('div'); g.className='grp'; g.textContent='Sample pages'; list.appendChild(g); }
      const b = document.createElement('button'); b.dataset.k = k;
      b.innerHTML = '<span class="no">' + String(ch.n).padStart(2,'0') + '</span><span class="t">' + ch.name + '</span><span class="d">' + ch.line + '</span>' + (ch.sample ? '<span class="tag">sample</span>' : '<span></span>');
      b.addEventListener('click', ()=>{ const t = document.querySelector('.page .tv'); if (t) tvTune(t, k); });
      list.appendChild(b);
    });
  }
  function tvTune(tv, i){
    tv.dataset.ch = (i + CHANNELS.length) % CHANNELS.length;
    const tube = tv.querySelector('.tube'), osd = tv.querySelector('.osd');
    tube.classList.add('zap'); osd.classList.remove('show');
    setTimeout(()=>{ tvRender(tv); tube.classList.remove('zap'); osd.classList.add('show'); setTimeout(()=> osd.classList.remove('show'), 1800); }, 320);
  }
  book.addEventListener('click', e => {
    const tv = e.target.closest('.tv'); if (!tv) return;
    if (e.target.closest('.knob')) { e.stopPropagation(); tvTune(tv, (+tv.dataset.ch||0) + 1); return; }
    const chip = e.target.closest('.chip'); if (chip) { e.stopPropagation(); tvTune(tv, +chip.dataset.k); return; }
    if (e.target.closest('.scr')) { e.stopPropagation(); window.open(CHANNELS[+tv.dataset.ch||0].url, '_blank', 'noopener'); }
  });
  book.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tv = e.target.closest('.tv'); if (!tv) return;
    if (e.target.classList.contains('knob')) { e.preventDefault(); tvTune(tv, (+tv.dataset.ch||0) + 1); }
    if (e.target.classList.contains('scr')) { e.preventDefault(); window.open(CHANNELS[+tv.dataset.ch||0].url, '_blank', 'noopener'); }
  });

  // ---- notes: the red pins. They open a note on the same page and never turn it. ----
  function closeSlips(){ document.querySelectorAll('.slip').forEach(s => { s.classList.remove('in'); setTimeout(()=> s.remove(), 550); }); book.classList.remove('note-open'); }
  book.addEventListener('click', e => {
    if (e.target.closest('.slip')) return;
    const pin = e.target.closest('.pin'); if (!pin) return;
    e.preventDefault(); e.stopPropagation();
    const page = pin.closest('.page, .face'); if (!page) return;
    const src = page.querySelector(`.notes [data-note="${pin.dataset.note}"]`); if (!src) return;
    closeSlips();
    const slip = document.createElement('div'); slip.className = 'slip'; slip.setAttribute('role','dialog');
    slip.innerHTML = `<button class="x" aria-label="Close note">×</button><div class="hd"><span class="no">Note</span><span class="t">${src.dataset.title || ''}</span></div>${src.innerHTML}`;
    page.appendChild(slip);
    book.classList.add('note-open');
    requestAnimationFrame(()=> requestAnimationFrame(()=> slip.classList.add('in')));
    slip.querySelector('.x').addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); closeSlips(); });
    slip.querySelector('.x').addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); }, true);
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSlips(); });

  // ---- the page turn ----
  // =====================================================================
  //  PAGE TURNS. One single-sided leaf: it rises to the edge (90 degrees),
  //  swaps to the other side of the spine at the edge, and comes down.
  //  Nothing here depends on how a browser draws the back of an element.
  // =====================================================================
  // a cubic-bezier solver so the whole turn runs on one continuous curve (quick lift, long settle)
  function bezier(x1,y1,x2,y2){
    const A=(a,b)=>1-3*b+3*a, B=(a,b)=>3*b-6*a, C=a=>3*a;
    const calc=(t,a,b)=>((A(a,b)*t+B(a,b))*t+C(a))*t;
    const slope=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+C(a);
    return x=>{ let t=x; for(let i=0;i<6;i++){ const sl=slope(t,x1,x2); if(!sl) break; t-=(calc(t,x1,x2)-x)/sl; } return calc(t,y1,y2); };
  }
  const turnEase = bezier(.42,.02,.22,1);
  const easeIn = 'cubic-bezier(.55,0,1,.55)', easeOut = 'cubic-bezier(0,.45,.45,1)';
  function makeLeaf(cls, htmlStr){
    const leaf = document.createElement('div'); leaf.className = 'leaf ' + cls;
    const face = document.createElement('div'); face.className = 'face front'; face.innerHTML = htmlStr;
    face.querySelectorAll('.slip, iframe').forEach(x=>x.remove());
    const shade = document.createElement('div'); shade.className = 'shade';
    leaf.append(face, shade); return leaf;
  }
  // dir 'fwd': starts on the right, lands on the left.  'bwd': the reverse.
  // up = what the rising side shows, down = what the landing side shows. The swap happens edge-on, at 90 degrees.
  function flipLeaf(dir, up, down, onMid, onDone){
    const leaf = makeLeaf(dir, up.html); const face = leaf.querySelector('.face'); const shade = leaf.querySelector('.shade');
    face.className = 'face front ' + (up.cls||''); if (up.hidden) face.style.visibility='hidden';
    leaf.style.transition = 'none'; shade.style.transition = 'none';
    book.appendChild(leaf);
    const fwd = dir==='fwd';
    let swapped = false; const t0 = performance.now();
    function frame(now){
      const t = Math.min(1, (now - t0) / FLIP);
      const a = turnEase(t) * 180;                       // 0 .. 180
      if (a >= 90 && !swapped) {
        swapped = true;
        leaf.classList.remove(fwd ? 'fwd' : 'bwd'); leaf.classList.add(fwd ? 'bwd' : 'fwd');
        face.className = 'face front ' + (down.cls||''); face.innerHTML = down.html; face.style.visibility = down.hidden ? 'hidden' : '';
        face.querySelectorAll('.slip, iframe').forEach(x=>x.remove());
        if (onMid) onMid();
      }
      const ang = a < 90 ? (fwd ? -a : a) : (fwd ? (180 - a) : -(180 - a));
      leaf.style.transform = 'rotateY(' + ang + 'deg)';
      shade.style.opacity = String(Math.sin(t * Math.PI) * 0.9);   // deepest at the edge
      if (t < 1) requestAnimationFrame(frame);
      else { leaf.remove(); if (onDone) onDone(); }
    }
    requestAnimationFrame(frame);
  }
  function folioFix(htmlStr, n){ const d = document.createElement('div'); d.innerHTML = htmlStr; d.querySelectorAll('.folio .n').forEach(x => x.textContent = String(n).padStart(2,'0')); return d.innerHTML; }
  const coverHTML = ()=> html(spreads[0].r);
  function coverPage(page){ page.className = 'page left cover'; page.innerHTML = coverHTML(); page.style.visibility=''; }

  // the closed book turning over: the wrap rotates to its edge, the state swaps, it rotates back down
  const wrap = document.getElementById('wrap');
  function reveal(){ wrap.classList.remove('reveal'); void wrap.offsetWidth; wrap.classList.add('reveal'); setTimeout(()=> wrap.classList.remove('reveal'), 1700); }
  const overEase = bezier(.5,.02,.3,1);
  function turnBookOver(toBack, done){
    wrap.classList.remove('reveal'); wrap.classList.add('sheen'); wrap.style.transition = 'none';
    let swapped = false; const t0 = performance.now(), D = 1500;
    function frame(now){
      const t = Math.min(1, (now - t0) / D);
      const a = overEase(t) * 180;
      if (a >= 90 && !swapped) {
        swapped = true;
        if (toBack) { book.classList.remove('front-closed'); paint(pR,'r',LAST); pR.style.visibility=''; book.classList.add('back-closed'); book.style.transform = 'translateX(-25%)'; }
        else { book.classList.remove('back-closed'); coverPage(pL); pR.style.visibility='hidden'; book.classList.add('front-closed'); book.style.transform = ''; }
      }
      const ang = a < 90 ? a : (180 - a);
      wrap.style.transform = 'rotateY(' + (toBack ? -ang : ang) + 'deg)';
      if (t < 1) requestAnimationFrame(frame);
      else { wrap.style.transition=''; wrap.style.transform=''; wrap.classList.remove('sheen'); if (done) done(); }
    }
    requestAnimationFrame(frame);
  }
  function flipBook(toBack){ if (!isDesk() || reduce) { book.classList.toggle('back-closed', toBack); book.style.transform = toBack ? 'translateX(-25%)' : ''; return; } turnBookOver(toBack); }

  // closing: the endpaper leaf folds over and lands as the front cover, then the closed book turns to its back
  function closeBook(){
    busy = true; book.classList.add('turning'); closeSlips();
    thread.classList.remove('draw'); thread.innerHTML = '';
    castL.classList.add('on');
    book.classList.add('front-closed');
    flipLeaf('fwd', { html: folioFix(html(spreads[LAST-1].r), (LAST-1)*2+1), cls: 'endpaper' }, { html: coverHTML(), cls: 'cover' }, ()=>{ pR.style.visibility = 'hidden'; coverPage(pL); }, ()=>{
      castL.classList.remove('on'); cur = LAST; rail();
      setTimeout(()=> turnBookOver(true, ()=>{ busy = false; book.classList.remove('turning'); }), 350);
    });
  }
  // opening from the back: the book turns to its front, the cover lifts, the last spread is back
  function openBack(to){
    busy = true; book.classList.add('turning'); closeSlips();
    turnBookOver(false, ()=>{
      pR.style.visibility = 'hidden'; castR.classList.add('on');
      book.classList.remove('front-closed');
      flipLeaf('bwd', { html: coverHTML(), cls: 'cover' }, { html: folioFix(html(spreads[LAST-1].r), (LAST-1)*2+1), cls: 'endpaper' }, ()=>{ paint(pL,'l',LAST-1); }, ()=>{
        paint(pR,'r',LAST-1); pR.style.visibility=''; castR.classList.remove('on');
        cur = LAST-1; drawThread(cur); rail(); busy = false; book.classList.remove('turning');
        if (to !== undefined && to !== LAST-1) setTimeout(()=> turn(to), 60);
      });
    });
  }

  function turn(to){
    if (busy || to===cur || to<0 || to>LAST) return;
    closeSlips();
    if (isDesk() && FLIP) {
      if (to===LAST && cur===LAST-1) { closeBook(); return; }
      if (to===LAST && cur<LAST-1) { turn(LAST-1); const w = setInterval(()=>{ if (!busy) { clearInterval(w); closeBook(); } }, 120); return; }
      if (cur===LAST) { openBack(to); return; }
    }
    if (cur===0 || to===0) reveal();
    if (!isDesk() || FLIP===0){ show(to); return; }
    busy = true; book.classList.add('turning');
    const fwd = to > cur;
    thread.classList.remove('draw'); thread.innerHTML = '';
    const emptyL = !!(spreads[to].l && spreads[to].l.classList.contains('empty'));
    let up, down;
    if (fwd){
      // rising side: the cover stays the cover; inner pages already show the incoming page
      up   = cur===0 ? { html: coverHTML(), cls: 'cover' } : { html: pR.innerHTML, cls: cls(spreads[cur].r) };
      down = { html: folioFix(html(spreads[to].l), to*2), cls: cls(spreads[to].l), hidden: emptyL };
      castL.classList.add('on');
    } else {
      up   = { html: pL.innerHTML, cls: cls(spreads[cur].l), hidden: !!(spreads[cur].l && spreads[cur].l.classList.contains('empty')) };
      down = { html: folioFix(html(spreads[to].r), to*2+1), cls: cls(spreads[to].r) };
      castR.classList.add('on');
    }
    cur = to; book.classList.toggle('closed', cur===0); book.classList.toggle('at-end', cur===LAST);
    // The leaf sits exactly over the page it started on (pR for fwd, pL for bwd) and is still
    // perfectly flat at t=0, so it fully hides that real page. As it rotates open, perspective
    // foreshortening exposes that real page's edge almost immediately — long before the 90°
    // midpoint. Paint the new content into it right now, while the leaf still hides it, so the
    // exposed sliver is already correct instead of showing a stale page for a beat.
    if (fwd) paint(pR,'r',to); else paint(pL,'l',to);
    flipLeaf(fwd ? 'fwd' : 'bwd', up, down,
      ()=>{ castL.classList.remove('on'); castR.classList.remove('on'); (fwd?castL:castR).classList.add('on'); },
      ()=>{
        if (fwd) paint(pL,'l',to); else paint(pR,'r',to);
        castL.classList.remove('on'); castR.classList.remove('on');
        drawThread(to); rail(); busy=false; book.classList.remove('turning');
        pL.querySelector('.inner')?.scrollTo(0,0); pR.querySelector('.inner')?.scrollTo(0,0);
      });
  }
  function go(i){ turn(Math.max(0, Math.min(LAST, i))); }
  window.redThread = { go, next: ()=>go(cur+1), prev: ()=>go(cur-1), get page(){ return cur; } };

  spreads.forEach((s,i)=>{
    const b = document.createElement('button'); b.setAttribute('aria-label', s.title);
    b.innerHTML = `<span>${s.title}</span>`; b.addEventListener('click', ()=> go(i)); knots.appendChild(b);
  });
  prevBtn.addEventListener('click', ()=> go(cur-1));
  nextBtn.addEventListener('click', ()=> go(cur+1));
  const pgL = document.getElementById('pgL'), pgR = document.getElementById('pgR');
  pgL.addEventListener('click', ()=> go(cur-1));
  pgR.addEventListener('click', ()=> go(cur+1));
  book.addEventListener('click', e => {
    const openBtn = e.target.closest('#coverOpen'); if (!openBtn) return;
    e.preventDefault(); e.stopPropagation(); go(cur+1);
  });
  pgL.addEventListener('keydown', e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); go(cur-1); } });
  pgR.addEventListener('keydown', e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); go(cur+1); } });
  document.addEventListener('keydown', e=>{
    if (e.target.matches('input,textarea')) return;
    if (e.key==='ArrowRight' || e.key==='PageDown') { e.preventDefault(); go(cur+1); }
    if (e.key==='ArrowLeft'  || e.key==='PageUp')  { e.preventDefault(); go(cur-1); }
    if (e.key==='Home') go(0);
    if (e.key==='End') go(LAST);
  });
  let sx=null, sy=null, st=0;
  book.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=performance.now(); }, {passive:true});
  book.addEventListener('touchend', e=>{
    if (sx===null) return;
    if (e.target.closest('.slip')) { sx=sy=null; return; }
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    const dt = performance.now() - st;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5) { go(dx<0 ? cur+1 : cur-1); sx=sy=null; return; }
    // Kindle-style tap-to-toggle chrome: a quick, short tap that wasn't a swipe and wasn't on
    // interactive content (pin, link, button, slip) toggles the header/footer visibility.
    if (!isDesk() && dt < 280 && Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      const t = e.target;
      if (!t.closest('.pin, a, button, .slip, iframe, .tv')) {
        document.body.classList.toggle('chrome-hidden');
        hideSwipeHint();
      }
    }
    sx=sy=null;
  }, {passive:true});
  // ---- mobile: first-visit swipe hint, dismissed on any interaction ----
  const swipehint = document.getElementById('swipehint');
  function hideSwipeHint(){ if (swipehint) swipehint.classList.remove('show'); }
  if (swipehint && !isDesk()) {
    try {
      if (!localStorage.getItem('rt-swipehint-seen')) {
        setTimeout(()=> swipehint.classList.add('show'), 900);
        setTimeout(hideSwipeHint, 5500);
        localStorage.setItem('rt-swipehint-seen', '1');
      }
    } catch(e){}
    book.addEventListener('touchstart', hideSwipeHint, {passive:true, once:true});
  }
  // ---- full screen: header and footer step out of the way; Esc brings them back ----
  const fsbtn = document.getElementById('fsbtn');
  function enterFS(){
    document.body.classList.add('fs');
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { req.call(el).catch?.(()=>{}); } catch(e){} }
    if (!busy) show(cur);
  }
  function exitFS(){
    document.body.classList.remove('fs');
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if ((document.fullscreenElement || document.webkitFullscreenElement) && ex) { try { ex.call(document); } catch(e){} }
    if (!busy) show(cur);
  }
  fsbtn.addEventListener('click', enterFS);
  document.addEventListener('fullscreenchange', ()=>{ if (!document.fullscreenElement) { document.body.classList.remove('fs'); if (!busy) show(cur); } });
  document.addEventListener('webkitfullscreenchange', ()=>{ if (!document.webkitFullscreenElement) { document.body.classList.remove('fs'); if (!busy) show(cur); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.classList.contains('fs') && !document.querySelector('.slip')) exitFS();
    if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.target.matches('input,textarea')) { document.body.classList.contains('fs') ? exitFS() : enterFS(); }
  });
  document.getElementById('fsL').addEventListener('click', ()=> go(cur-1));
  document.getElementById('fsR').addEventListener('click', ()=> go(cur+1));

  const m = location.hash.match(/^#p(\d+)$/);
  show(m ? Math.min(LAST, +m[1]) : 0);
  window.addEventListener('resize', ()=>{ if (!busy) show(cur); });
})();
</script>
